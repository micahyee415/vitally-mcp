# Cloud Build pipeline for vitally-mcp-server
#
# Run manually:  gcloud builds submit --config cloudbuild.yaml --project your-gcp-project .

steps:
  # Step 1: Security scan
  - name: "node:22-slim"
    entrypoint: bash
    args:
      - -c
      - |
        npm ci --ignore-scripts
        npm audit --audit-level=high

  # Step 2: Build container image
  - name: "gcr.io/cloud-builders/docker"
    args:
      - build
      - -t
      - gcr.io/$PROJECT_ID/vitally-mcp-server
      - .

  # Step 3: Push image
  - name: "gcr.io/cloud-builders/docker"
    args:
      - push
      - gcr.io/$PROJECT_ID/vitally-mcp-server

  # Step 4: Deploy to Cloud Run
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: gcloud
    args:
      - run
      - deploy
      - vitally-mcp
      - --image
      - gcr.io/$PROJECT_ID/vitally-mcp-server
      - --region
      - us-central1
      - --platform
      - managed
      - --max-instances=1
      - --concurrency=80
      - --quiet

images:
  - gcr.io/$PROJECT_ID/vitally-mcp-server
